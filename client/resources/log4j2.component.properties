# Taille du ring buffer des AsyncLogger (doit être une puissance de 2).
# Défaut log4j2 : 262144 (256K événements) — trop juste pour un dump qui logue
# des milliers de régions d'un coup. 4M événements = ~4M * ~200o ≈ 800 Mo max théorique,
# en pratique bien moins car les événements sont recyclés.
log4j2.asyncLoggerRingBufferSize=4194304

# Stratégie d'attente quand le ring buffer est plein :
#   Block (défaut) = l'applicatif attend, aucun log perdu, mais peut ralentir le thread appelant
#   Sleep         = dort par petits paliers (log4j2.asyncLoggerSleepTimeNanos), bon compromis
#   Yield         = yield le CPU
#   BusySpin      = 100% CPU, latence minimale
log4j2.asyncLoggerWaitStrategy=Sleep
log4j2.asyncLoggerSleepTimeNanos=100

# Politique si le buffer est plein malgré tout (DefaultAsyncQueueFullPolicy = log perdu + warning)
# ou BlockingAsyncQueueFullPolicy = bloque. 'Discard' = jette les logs de niveau <= DiscardingThreshold.
# log4j2.AsyncQueueFullPolicy=Default
# log4j2.asyncLoggerDiscardingThreshold=INFO

# Rend TOUS les loggers asynchrones (AsyncLoggerContextSelector) — sinon seuls les loggers
# explicitement déclarés en <AsyncLogger name="..."> le seraient. Nécessite com.lmax.disruptor.
log4j2.contextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
